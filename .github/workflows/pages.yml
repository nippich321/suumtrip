name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data img assets _site/
          touch _site/.nojekyll
          # GitHub Pages lets browsers keep files for 10 minutes; tag our CSS, scripts,
          # module imports and the data file with this commit so a reload shows new work
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href=\"css/[^\"?]+\.css)\"#?v=$v\"#g; s#(src=\"js/[^\"?]+\.js)\"#?v=$v\"#g" _site/index.html
          sed -i -E "s#(from '\./[^'?]+\.js)'#?v=$v'#g; s#(fetch\('data/[^'?]+\.json)'#?v=$v'#g" _site/js/*.js
          grep -c "?v=$v" _site/index.html _site/js/*.js || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
