    (() => {
      const tl = gsap.timeline({ paused: true });
      const D = 5.6;
      // the page lands slightly large after the click and settles
      tl.fromTo('#dg-world', { scale: 1.06 }, { scale: 1, duration: 0.6, ease: 'expo.out' }, 0);
      // constant scroll, the site's speeds: scene 5091 px per 18 s, clouds per 80 s, dashes 411.4 px per 0.7 s

      tl.fromTo('#dg-clouds', { x: -200 }, { x: -200 - 5091 * D / 80 * 1.6, duration: D, ease: 'none' }, 0);

      tl.fromTo('#dg-bounce', { y: 0 }, { y: -6, duration: 0.21, ease: 'sine.inOut', yoyo: true, repeat: 25 }, 0);
      tl.fromTo('#dg-head', { rotate: -3 }, { rotate: 3, duration: 0.65, ease: 'sine.inOut', yoyo: true, repeat: 8 }, 0);
