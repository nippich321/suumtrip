<!doctype html>
<html lang="th" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <style>
      @font-face { font-family: 'Mitr'; font-weight: 500; src: url('assets/fonts/mitr-thai-500-normal.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: 'Mitr'; font-weight: 500; src: url('assets/fonts/mitr-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215; }
      @font-face { font-family: 'Mitr'; font-weight: 600; src: url('assets/fonts/mitr-thai-600-normal.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: 'Mitr'; font-weight: 600; src: url('assets/fonts/mitr-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215; }
      @font-face { font-family: 'Anuphan'; font-weight: 500; src: url('assets/fonts/anuphan-thai-500-normal.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: 'Anuphan'; font-weight: 500; src: url('assets/fonts/anuphan-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215; }
      @font-face { font-family: 'Anuphan'; font-weight: 600; src: url('assets/fonts/anuphan-thai-600-normal.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: 'Anuphan'; font-weight: 600; src: url('assets/fonts/anuphan-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215; }
      @font-face { font-family: 'Anuphan'; font-weight: 700; src: url('assets/fonts/anuphan-thai-700-normal.woff2') format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: 'Anuphan'; font-weight: 700; src: url('assets/fonts/anuphan-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2190-21FF, U+2212, U+2215; }
      /* Suumtrip demo, 2:00, motion version. Fast cuts, colour-stripe wipes between scenes. Silent: voice-over later. */
      :root { --cream: #fff7f0; --ink: #221c33; --coral: #ff6b4a; --coral-d: #d94a2b; --sun: #ffb020; --teal: #10a39a; --muted: #6e6680;
        --font-display: 'Mitr', sans-serif; --font-body: 'Anuphan', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-body); color: var(--ink); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .scene { overflow: hidden; }
      .dark { background: var(--ink); color: #fff; }
      .cream { background: var(--cream); }
      .grad { background: radial-gradient(circle at 20% 20%, #ffd1c4 0, transparent 45%), radial-gradient(circle at 85% 80%, #ffe2a6 0, transparent 45%), var(--cream); }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .disp { font-family: var(--font-display); font-weight: 600; line-height: 1.12; }
      .abs { position: absolute; }

      /* wipe: three skewed colour stripes that sweep across between scenes */
      .wipe { position: absolute; top: -10%; height: 120%; width: 2600px; left: 0; z-index: 50; transform: skewX(-18deg); }
      .w1 { background: var(--coral); } .w2 { background: var(--sun); } .w3 { background: var(--ink); }


      /* hook */
      #hook .w { font-size: 170px; }
      /* chat */
      .phone { width: 520px; height: 880px; background: #fff; border-radius: 52px; border: 12px solid var(--ink); padding: 26px 22px; box-shadow: 0 40px 100px rgba(34, 28, 51, .25); }
      .phone-h { text-align: center; font-weight: 700; font-size: 26px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
      .m { font-size: 28px; padding: 12px 20px; border-radius: 24px; background: #f0eef3; display: inline-block; margin-top: 14px; max-width: 78%; }
      .m small { display: block; font-size: 17px; color: var(--muted); }
      .row { display: flex; } .row.me { justify-content: flex-end; }
      .m.me { background: var(--coral); color: #fff; }
      .stamp { font-family: var(--font-display); font-size: 92px; color: var(--coral-d); border: 10px solid var(--coral-d); border-radius: 26px; padding: 6px 40px; background: rgba(255, 255, 255, .9); }
      /* logo */
      .rays { width: 1500px; height: 1500px; border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(255, 176, 32, .22) 0 10deg, transparent 10deg 20deg); }
      .logo { width: 420px; height: 420px; }
      .ttl { font-size: 190px; color: var(--ink); }
      .ttl span { display: inline-block; }
      .sub { font-family: var(--font-display); font-size: 64px; color: var(--coral); }
      .chip { display: inline-flex; align-items: center; gap: 12px; background: #fff; border-radius: 999px; padding: 14px 28px; font-size: 34px; font-weight: 700; box-shadow: 0 12px 30px rgba(34, 28, 51, .18); }
      .chip i { color: var(--coral); font-size: 40px; }
      .big { font-size: 120px; }
      .confetti { z-index: 5; } .confetti i { position: absolute; width: 18px; height: 30px; border-radius: 4px; }
      /* map overlay */
      .shade { background: linear-gradient(90deg, rgba(34, 28, 51, .82) 0, rgba(34, 28, 51, .55) 34%, rgba(34, 28, 51, 0) 60%); }
      .kt { position: absolute; left: 110px; color: #fff; }
      /* features */
      .feat { width: 760px; height: 300px; background: #fff; border-radius: 34px; box-shadow: 0 24px 60px rgba(34, 28, 51, .14); display: flex; align-items: center; gap: 34px; padding: 0 50px; }
      .feat i { font-size: 110px; color: var(--coral); }
      .feat b { font-family: var(--font-display); font-weight: 600; font-size: 50px; line-height: 1.2; }
      .feat small { display: block; font-size: 30px; color: var(--muted); font-weight: 600; }
      /* money */
      .num { font-family: var(--font-display); font-size: 180px; line-height: 1; }
      .lab { font-size: 38px; color: #cbc5d8; font-weight: 600; }
      .op { font-family: var(--font-display); font-size: 150px; color: #8f87a3; }
      .bar { position: absolute; left: 260px; width: 1400px; height: 86px; top: 760px; border-radius: 20px; overflow: hidden; background: #3a3350; }
      .bar .room { position: absolute; left: 0; top: 0; bottom: 0; width: 1036px; background: #8f87a3; }
      .bar .ours { position: absolute; left: 1036px; top: 0; bottom: 0; width: 364px; background: var(--coral); }
      .tag { font-size: 30px; font-weight: 700; color: #8a5a00; background: #fff1d1; border-radius: 999px; padding: 8px 26px; }
      /* revenue */
      .rev { width: 380px; height: 580px; background: #fff; border-radius: 40px; box-shadow: 0 30px 80px rgba(34, 28, 51, .16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 40px; }
      .rev i { font-size: 130px; color: var(--coral); }
      .rev b { font-family: var(--font-display); font-weight: 600; font-size: 48px; line-height: 1.15; }
      .rev small { font-size: 28px; color: var(--muted); font-weight: 600; }
      /* ota */
      .half { position: absolute; top: 0; height: 1080px; width: 960px; display: flex; flex-direction: column; justify-content: center; padding: 0 110px; gap: 26px; }
      .half h2 { font-family: var(--font-display); font-weight: 600; font-size: 96px; line-height: 1.1; }
      .half li { list-style: none; font-size: 46px; font-weight: 600; }
      #prog { position: absolute; left: 0; top: 1070px; bottom: auto; height: 10px; width: 1920px; background: var(--coral); transform-origin: 0 50%; z-index: 60; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="119.6" data-width="1920" data-height="1080">

      <!-- 1 hook -->
      <section id="hook" class="clip scene dark center" data-start="0" data-duration="5.2" data-track-index="0">
        <div class="disp w" id="h1">อยากเที่ยว</div>
        <div class="disp w" id="h2" style="color:var(--coral)">แต่ไม่อยากวางแผน?</div>
      </section>

      <!-- 2 chat -->
      <section id="chat" class="clip scene grad center" data-start="5" data-duration="7.6" data-track-index="1">
        <div class="phone" id="phone">
          <div class="phone-h">ทริปเพื่อนรัก (4)</div>
          <div class="row"><div class="m"><small>บอส</small>เสาร์นี้ไปเที่ยวกันมั้ย</div></div>
          <div class="row"><div class="m"><small>แพร</small>ไปไหนดีอะ</div></div>
          <div class="row me"><div class="m me">ทะเลมั้ย</div></div>
          <div class="row"><div class="m"><small>บอส</small>ไม่เอา ร้อน ภูเขาดีกว่า</div></div>
          <div class="row"><div class="m"><small>แพร</small>แล้วที่พักใครหา</div></div>
          <div class="row"><div class="m"><small>บอส</small>ขี้เกียจหาอะ 555</div></div>
          <div class="row me"><div class="m me">ไว้คราวหน้าละกัน...</div></div>
        </div>
        <div class="stamp abs" id="stamp" style="left:1180px;top:430px">ไม่ได้ไปอีกแล้ว</div>
      </section>

      <!-- 3 logo -->
      <section id="brand" class="clip scene grad center" data-start="12.4" data-duration="3.05" data-track-index="0">
        <div class="rays abs" id="rays1" style="left:210px;top:-210px"></div>
        <img class="logo" id="logo1" src="assets/logo-512.png" alt="" />
        <div class="disp ttl" id="ttl1"><span>สุ่</span><span>ม</span><span>ท</span><span>ริ</span><span>ป</span></div>
        <div class="sub" id="sub1">เลือกแค่แนว ที่เหลือกล่องจัดให้</div>
      </section>

      <!-- 4 booking, rebuilt from the site's steps (compositions/booking.html) -->
      <div id="booking" data-composition-id="booking" data-composition-src="compositions/booking.html" data-start="15.4" data-duration="24.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- 5 open the box: the real page, recorded slowed down so it plays at a full 30 fps -->
      <div id="openbg" class="clip" data-start="40" data-duration="1" data-track-index="2" style="background:var(--coral)"></div>
      <video id="o1" class="clip" data-track-index="3" muted src="assets/trip.mp4" data-start="40" data-duration="13.9" data-media-start="0.3" style="object-fit:cover"></video>
      <div id="dog" data-composition-id="dog" data-composition-src="compositions/dog.html" data-start="46" data-duration="5.6" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div class="confetti abs" id="conf" style="left:960px;top:400px;width:0;height:0"></div>
      <div class="chip abs" id="openchip" style="left:0;top:0"><i class="ti ti-gift"></i> เปิดกล่องแล้วรู้ทันทีว่าได้ไปไหน!</div>

      <!-- 6-11 train map, features, money, revenue, OTA, end card (compositions/story.html) -->
      <div id="story" data-composition-id="story" data-composition-src="compositions/story.html" data-start="53.9" data-duration="65.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- wipes -->
      <div class="clip wipe w1" id="wa" data-start="0" data-duration="119.6" data-track-index="5"></div>
      <div class="clip wipe w2" id="wb" data-start="0" data-duration="119.6" data-track-index="6"></div>
      <div class="clip wipe w3" id="wc" data-start="0" data-duration="119.6" data-track-index="7"></div>
      <div id="prog" class="clip" data-start="0" data-duration="119.6" data-track-index="8"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = 'power3.out', B = 'back.out(1.8)';

      // ---- wipes: stripes start off-screen left, sweep across and leave right; the cut happens under them
      gsap.set(['#wa', '#wb', '#wc'], { x: -2900 });
      gsap.set('#openchip', { opacity: 0 });
      const wipe = (t) => {
        tl.fromTo('#wa', { x: -2900 }, { x: 2300, duration: 0.85, ease: 'power2.inOut' }, t - 0.42);
        tl.fromTo('#wb', { x: -2900 }, { x: 2300, duration: 0.85, ease: 'power2.inOut' }, t - 0.36);
        tl.fromTo('#wc', { x: -2900 }, { x: 2300, duration: 0.85, ease: 'power2.inOut' }, t - 0.30);
      };
      [12.4].forEach(wipe);

      // ---- 1 hook
      tl.fromTo('#h1', { scale: 2.6, opacity: 0, filter: 'blur(20px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: E }, 0.2);
      tl.fromTo('#h2', { y: 140, opacity: 0, scale: .8 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: B }, 1.6);
      tl.to('#h2', { keyframes: [{ x: -14 }, { x: 14 }, { x: -8 }, { x: 0 }], duration: 0.3 }, 2.2);
      tl.to(['#h1', '#h2'], { scale: 1.08, duration: 2.6, ease: 'none' }, 2.4);
      tl.to('#hook', { opacity: 0, duration: 0.25 }, 4.95);

      // ---- 2 chat: bubbles pop one by one, then the stamp slams
      tl.fromTo('#phone', { y: 300, rotate: -6, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.6, ease: B }, 5);
      gsap.utils.toArray('#phone .row').forEach((r, i) => tl.fromTo(r, { scale: 0.3, opacity: 0, transformOrigin: i === 2 || i === 6 ? '100% 50%' : '0% 50%' }, { scale: 1, opacity: 1, duration: 0.32, ease: B }, 5.6 + i * 0.62));
      tl.fromTo('#stamp', { scale: 3.5, opacity: 0, rotate: -24 }, { scale: 1, opacity: 1, rotate: -12, duration: 0.35, ease: 'power4.in' }, 10.3);
      tl.to('#phone', { keyframes: [{ x: -10 }, { x: 10 }, { x: 0 }], duration: 0.2 }, 10.65);

      // ---- 3 brand: box drops and bounces, rays spin, letters jump up
      tl.fromTo('#logo1', { y: -700, rotate: -20 }, { y: 0, rotate: 0, duration: 0.9, ease: 'bounce.out' }, 12.6);
      tl.fromTo('#rays1', { scale: 0, rotate: 0 }, { scale: 1, rotate: 90, duration: 5.6, ease: 'power1.out' }, 12.6);
      tl.fromTo('#ttl1 span', { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: B, stagger: 0.07 }, 13.4);
      tl.fromTo('#sub1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 13.95);
      // zoom through the box: its coral side fills the frame and the booking opens out of it
      tl.to(['#ttl1', '#sub1', '#rays1'], { opacity: 0, filter: 'blur(10px)', duration: 0.2, ease: 'power2.in' }, 14.85);
      tl.to('#logo1', { scale: 40, transformOrigin: '90px 285px', duration: 0.5, ease: 'power3.in' }, 14.9);

      // ---- 5 open: an iris from the pay button opens on the real box page; the camera follows the click,
      // the roulette and the lid, confetti bursts with the lid, then a push toward the plan button
      // footage marks (seconds of this scene's footage, played from 0.3): box clicked 1.0, names roll
      // 1.5-3.8, lid pops 3.85, plan button clicked 6.0, loading scene 6.6, map 11.5
      const at = (m) => 39.7 + m;
      // camera on the footage: scale about the frame centre plus a shift that keeps the subject placed
      const cam = (s, y, t, d, ease) => tl.to('#o1', { scale: s, y, duration: d, ease }, t);
      tl.fromTo('#o1', { scale: 1.7, y: 287, clipPath: 'circle(0% at 1170px 728px)' }, { scale: 1.7, y: 287, clipPath: 'circle(150% at 1170px 728px)', duration: 0.55, ease: 'expo.out' }, 40.0);
      tl.set('#o1', { clipPath: 'none' }, 40.6);
      tl.set('#o1', { scale: 1.82 }, at(3.85));                      // the lid pops: a hit, no ease
      cam(1.7, 287, at(3.86), 0.35, 'power2.out');
      cam(1.2, 72, at(4.45), 0.7, 'power2.inOut');                   // pull back to the reveal card
      cam(1.6, -135, at(5.4), 0.5, 'power2.inOut');                  // push toward the plan button
      cam(1, 0, at(6.55), 0.5, 'expo.out');                          // the loading scene lands large and settles
      gsap.set('#openchip', { xPercent: -50, left: 960, top: 948 });
      tl.fromTo('#openchip', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, at(4.5));
      tl.to('#openchip', { opacity: 0, filter: 'blur(8px)', duration: 0.2 }, at(5.35));
      const conf = document.getElementById('conf');
      let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const colors = ['#ff6b4a', '#ffb020', '#10a39a', '#7a5af8', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        const c = document.createElement('i');
        c.style.background = colors[i % colors.length];
        conf.appendChild(c);
        gsap.set(c, { opacity: 0 });
        const a = rnd() * Math.PI * 2, r = 300 + rnd() * 700;
        tl.fromTo(c, { x: 0, y: 0, rotate: 0, opacity: 1 }, { x: Math.cos(a) * r, y: Math.sin(a) * r - 200, rotate: rnd() * 720, opacity: 0, duration: 1.4 + rnd() * 0.6, ease: 'power2.out', immediateRender: false }, at(3.85) + rnd() * 0.12);
      }
      tl.fromTo('#prog', { scaleX: 0 }, { scaleX: 1, duration: 119.6, ease: 'none' }, 0);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
