        ['องค์พระปฐมเจดีย์', 'นครปฐม'], ['เมืองราชบุรี', 'ราชบุรี'], ['เมืองเพชร เขาวัง', 'เพชรบุรี']];
      $('#bk-list').innerHTML = C.map(([n, p, g], i) => `<div class="cr ${g ? 'gold' : ''}" id="bk-cr${i}" style="top:${20 + i * 100}px">

      const click = (t) => tl.to('#bk-cur', { keyframes: [{ scale: 0.82, duration: 0.07 }, { scale: 1, duration: 0.12 }], transformOrigin: '0 0' }, t);
      const done = (i, t) => {
        tl.fromTo(`#bk-ok${i}`, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: POP }, t);
        tl.fromTo(`#bk-rs${i} .dot`, { scale: 1 }, { keyframes: [{ scale: 1.25, duration: 0.12 }, { scale: 1, duration: 0.25 }] }, t);
      };

      // ---- 0: the brand's box fills the frame in coral; it opens like an iris onto the first step

      tl.fromTo('#bk-rail', { y: -140 }, { y: 0, duration: 0.6, ease: IN }, 0.2);

      // ---- 1 category (0-4.4)

      move(980, 640, 1.75, 0.5);
      click(2.3);
      tl.fromTo('#bk-c1', { scale: 1 }, { scale: 1.04, duration: 0.4, ease: POP }, 2.32);
      tl.fromTo('#bk-ring1', { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 2.32);
      tl.fromTo('#bk-tick1', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: POP }, 2.36);
      tl.to(['#bk-c0', '#bk-c2'], { opacity: 0.35, filter: 'blur(3px)', scale: 0.97, duration: 0.35 }, 2.4);
      done(0, 3.2);
      // the picked card's picture becomes the world
      leave(['#bk-t1', '#bk-s1', '#bk-c0', '#bk-c2'], 3.4);
      tl.to('#bk-cur', { opacity: 0, duration: 0.15 }, 3.4);
      tl.fromTo('#bk-world', { opacity: 0, clipPath: 'inset(300px 700px 440px 700px round 34px)' }, { opacity: 1, clipPath: 'inset(0px 0px 0px 0px round 0px)', duration: 0.7, ease: SWAY }, 3.45);
      tl.to('#bk-c1', { opacity: 0, duration: 0.15 }, 3.5);
      tl.fromTo('#bk-veil', { opacity: 0 }, { opacity: 0.86, duration: 0.45, ease: 'power2.out' }, 4.15);

      // ---- 2 date (4.4-8.6)
      words('#bk-t2', 4.4);
      tl.fromTo('#bk-cal', { opacity: 0, scale: 0.7, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: IN }, 4.45);
      tl.fromTo('#bk-grid .cd', { opacity: 0 }, { opacity: (i, el) => (el.classList.contains('past') ? 0.28 : 1), duration: 0.2, stagger: 0.012 }, 4.7);
      tl.set('#bk-cur', { x: 1500, y: 1120, opacity: 1 }, 5.0);
      move(705, 792, 5.05, 0.75);
      click(5.85);
      tl.fromTo('#bk-h27', { opacity: 1, scale: 0, backgroundColor: '#ff6b4a' }, { opacity: 1, scale: 1, backgroundColor: '#ff6b4a', duration: 0.35, ease: POP }, 5.88);
      tl.to('#bk-d27', { color: '#ffffff', duration: 0.1 }, 5.9);
      tl.to('#bk-d27 small', { color: '#ffe1d9', duration: 0.1 }, 5.9);
      tl.fromTo('#bk-h28', { opacity: 1, scale: 0, backgroundColor: '#ffd9cc' }, { opacity: 1, scale: 1, backgroundColor: '#ffd9cc', duration: 0.35, ease: POP }, 6.05);
      tl.fromTo('#bk-range', { opacity: 0 }, { opacity: 1, duration: 0.01 }, 6.2);
      tl.fromTo('#bk-r1', { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: IN }, 6.2);
      tl.fromTo('#bk-r2', { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: IN }, 6.3);
      tl.to('#bk-cur', { x: 1100, y: 1000, duration: 0.6, ease: SWAY }, 6.5);
      done(1, 7.6);
      // whip away to the left
      tl.to(['#bk-t2', '#bk-cal', '#bk-range'], { x: -1500, filter: 'blur(18px)', duration: 0.35, ease: PUSH }, 8.2);
      tl.to('#bk-cur', { opacity: 0, duration: 0.1 }, 8.2);

      // ---- 3 transport (8.55-12.3)
      ['#bk-t3', '#bk-s3', '#bk-tr0', '#bk-tr1'].forEach((s, i) => tl.fromTo(s, { x: 2000, opacity: 1, filter: 'blur(18px)' }, { x: 0, opacity: 1, filter: 'blur(0px)', duration: 0.55, ease: IN }, 8.5 + i * 0.05));
      tl.set('#bk-cur', { x: 1300, y: 1120, opacity: 1 }, 9.0);
      move(560, 610, 9.05, 0.75);
      click(9.85);
      tl.fromTo('#bk-tr0', { scale: 1 }, { scale: 1.03, duration: 0.4, ease: POP }, 9.87);
      tl.fromTo('#bk-ring3', { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25 }, 9.87);
      tl.fromTo('#bk-tick3', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: POP }, 9.9);
      tl.fromTo('#bk-icf', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: POP }, 9.9);
      tl.to('#bk-tr1', { opacity: 0.35, filter: 'blur(3px)', duration: 0.35 }, 9.95);
      done(2, 10.6);
      tl.to('#bk-cur', { x: 330, y: 560, duration: 0.5, ease: SWAY }, 10.7);
      // zoom through the train icon: its coral fill becomes the next frame
      tl.to('#bk-cur', { opacity: 0, duration: 0.1 }, 11.25);
      tl.set('#bk-flood', { opacity: 1, scale: 1.03 }, 11.3);
      tl.to('#bk-flood', { scale: 26, duration: 0.55, ease: PUSH }, 11.3);

      // ---- 4 travellers (11.9-15.8), on coral
      tl.set(['#bk-t3', '#bk-s3', '#bk-tr0', '#bk-tr1'], { opacity: 0 }, 11.86);
      words('#bk-whot', 11.95);
      tl.fromTo('#bk-who', { opacity: 0, y: 260, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: IN }, 11.95);
      tl.set('#bk-cur', { x: 1600, y: 1120, opacity: 1 }, 12.5);
      move(1300, 585, 12.55, 0.7);
      click(13.3);
      tl.to('#bk-k0', { y: -84, opacity: 0, duration: 0.25, ease: 'power2.in' }, 13.32);
      tl.fromTo('#bk-k1', { y: 84, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: POP }, 13.4);
      tl.to('#bk-kmin', { color: '#221c33', duration: 0.2 }, 13.4);
      tl.to('#bk-cur', { x: 1500, y: 980, duration: 0.5, ease: SWAY }, 13.7);
      // carried into the rail's fourth step
      tl.to('#bk-cur', { opacity: 0, duration: 0.1 }, 14.4);
      leave('#bk-whot', 14.4);
      tl.to('#bk-who', { x: 98, y: -438, scale: 0.05, opacity: 0.2, filter: 'blur(6px)', duration: 0.55, ease: PUSH }, 14.45);
      done(3, 14.95);
      tl.to('#bk-flood', { backgroundColor: '#fff7f0', duration: 0.4, ease: SWAY }, 15.0);

      // ---- 5 candidates (15.4-21.3)
      words('#bk-t5', 15.4);
      tl.fromTo('#bk-s5', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.8);
      tl.fromTo('#bk-list', { opacity: 0, y: 100 }, { opacity: 1, y: 0, duration: 0.7, ease: IN }, 15.5);
      tl.fromTo('.cr', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: IN, stagger: 0.06 }, 15.7);
      C.forEach(([, , g], i) => tl.fromTo(`#bk-bar${i}`, { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: g ? 0.1 : 0.18, duration: 0.7, ease: IN }, 16.1 + i * 0.06));
      tl.set('#bk-cur', { x: 1700, y: 1120, opacity: 1 }, 16.6);
      move(1505, 380, 16.65, 0.8);
      click(17.6);
      tl.to('#bk-vt0', { opacity: 0, duration: 0.12 }, 17.62);
      tl.fromTo('#bk-vt1', { opacity: 0 }, { opacity: 1, duration: 0.15 }, 17.7);
      tl.to('#bk-cr0', { opacity: 0.45, duration: 0.3 }, 17.65);
      tl.fromTo('#bk-strike', { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 17.65);
      tl.to('#bk-bar0', { scaleX: 0, duration: 0.5, ease: 'power2.inOut' }, 17.7);
      // the other ordinary destinations share its odds: 90 % / 4 = 23 % each (rounded, as on the site)
      [1, 3, 4, 5].forEach((i) => tl.to(`#bk-bar${i}`, { scaleX: 0.23, duration: 0.6, ease: POP }, 17.95));
      const roll = (sel, from, to, t) => { const o = { v: from }; tl.to(o, { v: to, duration: 0.6, ease: 'power2.out', onUpdate: () => { $(sel).textContent = Math.round(o.v); } }, t); };
      roll('#bk-od0', 18, 0, 17.7);
      [1, 3, 4, 5].forEach((i) => roll(`#bk-od${i}`, 18, 23, 17.95));
      tl.to('#bk-cur', { x: 1640, y: 900, duration: 0.6, ease: SWAY }, 18.4);
      done(4, 20.4);
      leave(['#bk-t5', '#bk-s5', '#bk-list'], 20.9);
      tl.to('#bk-cur', { opacity: 0, duration: 0.1 }, 20.9);

      // ---- 6 pay (21.1-25.6)
      words('#bk-t6', 21.1);
      tl.fromTo('#bk-pay', { opacity: 0, filter: 'blur(10px)', scale: 0.94 }, { opacity: 1, filter: 'blur(0px)', scale: 1, duration: 0.5, ease: IN }, 21.15);

      ['#bk-p1', '#bk-p2', '#bk-p3'].forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: POP }, 22.0 + i * 0.45));
      tl.set('#bk-cur', { x: 1500, y: 1120, opacity: 1 }, 22.6);
      move(1180, 735, 22.65, 0.8);
      click(23.6);
      tl.to('#bk-paybtn', { keyframes: [{ scale: 0.95, duration: 0.08 }, { scale: 1, duration: 0.15 }] }, 23.6);
      done(5, 23.7);
      // an iris from the button opens onto the box
      tl.set('#bk-iris', { opacity: 1, scale: 0.2 }, 23.85);
      tl.to('#bk-iris', { scale: 46, duration: 0.6, ease: PUSH }, 23.85);
      tl.to('#bk-cur', { opacity: 0, duration: 0.1 }, 24.2);

      window.__timelines['booking'] = tl;
    })();
  </script>
</template>
