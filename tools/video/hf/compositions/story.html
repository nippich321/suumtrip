  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const IN = 'expo.out', SWAY = 'power2.inOut', PUSH = 'power3.in';
      ['#st-fh', '#st-mh', '#st-rh'].forEach((s) => { const el = $(s); el.innerHTML = el.textContent.split(' ').map((w) => `<span>${w}</span>`).join(' '); });
      const words = (sel, t) => tl.fromTo(`${sel} span`, { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power2.out', stagger: 0.08 }, t);
      const leave = (sels, t, d = 0.2) => tl.to(sels, { opacity: 0, filter: 'blur(10px)', duration: d, ease: 'power2.in' }, t);
      const count = (sel, to, t, d = 1.3) => { const o = { v: 0 }; tl.to(o, { v: to, duration: d, ease: 'power2.out', onUpdate: () => { $(sel).textContent = Math.round(o.v).toLocaleString('en-US'); } }, t); };
      gsap.set(['#st-f1', '#st-f2', '#st-f3', '#st-f4', '#st-dark', '#st-m1', '#st-m2', '#st-m3', '#st-o1', '#st-o2', '#st-bar', '#st-src', '#st-tag', '#st-coral',
        '#st-r1', '#st-r2', '#st-r3', '#st-r4', '#st-left', '#st-right', '#st-vs', '#st-refs', '#st-logo', '#st-badge', '#st-slogan', '#st-url'], { opacity: 0 });

      // ---- map (0-12.5): push in on the train, the words land on a dark band, then the map shrinks onto card 1

      tl.fromTo('#st-k2', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3 }, 1.5);
      tl.fromTo('#st-k3', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 2.0);
      // the departure time rolls in like a station board
      const clock = { v: 0 };
      tl.fromTo(clock, { v: 0 }, { v: 3, duration: 0.4, ease: 'none', onUpdate: () => { $('#st-clock').textContent = ['07:00', '07:15', '07:30', '07:45'][Math.round(clock.v)]; } }, 2.1);
      leave(['#st-k1', '#st-k2', '#st-k3', '#st-band'], 6.4, 0.25);
      tl.to('#st-map', { scale: 1, duration: 0.9, ease: SWAY }, 6.5);
      // carry across: the map becomes the first feature card's picture
      tl.fromTo('#st-map', { clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: 'inset(0px 420px 0px 420px round 110px)', duration: 0.6, ease: SWAY }, 11.1);
      tl.to('#st-map', { scale: 0.306, x: -685, y: -125, duration: 0.8, ease: SWAY }, 11.3);
      tl.fromTo('#st-f1', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.8);

      // ---- features (12.5-22.6)
      words('#st-fh', 12.3);

        tl.fromTo(f, { opacity: 0, y: 80, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: IN }, 12.9 + i * 0.5);
        tl.fromTo(`${f} .ic i`, { scale: 0.4, rotate: -20 }, { scale: 1, rotate: 0, duration: 0.6, ease: IN }, 13.0 + i * 0.5);
      });
      // the ground floods dark for the money
      leave(['#st-fh', '#st-f1', '#st-f2', '#st-f3', '#st-f4'], 22.1, 0.25);
      tl.fromTo('#st-dark', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SWAY }, 22.2);

      // ---- money (22.6-38.1): one figure at a time, the earlier ones step back
      words('#st-mh', 22.7);
      tl.fromTo('#st-m1', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 23.3); count('#st-n1', 1290, 23.35);
      tl.fromTo('#st-o1', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 25.0);
      tl.to('#st-m1', { opacity: 0.55, duration: 0.3 }, 25.2);
      tl.fromTo('#st-m2', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 25.3); count('#st-n2', 955, 25.35);
      tl.fromTo('#st-o2', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 27.0);
      tl.to('#st-m2', { opacity: 0.55, duration: 0.3 }, 27.2);
      tl.fromTo('#st-m3', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 27.3); count('#st-n3', 335, 27.35);
      tl.fromTo('#st-hl', { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: 0.5, ease: SWAY }, 28.8);
      tl.to(['#st-m1', '#st-m2'], { opacity: 1, duration: 0.4 }, 29.6);
      tl.fromTo('#st-bar', { opacity: 0, scaleX: 0, transformOrigin: '0 50%' }, { opacity: 1, scaleX: 1, duration: 0.7, ease: IN }, 29.8);
      tl.fromTo('#st-room', { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: 0.8, ease: IN }, 30.2);
      tl.fromTo('#st-ours', { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: 0.6, ease: IN }, 30.8);
      tl.fromTo('#st-src', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 31.6);
